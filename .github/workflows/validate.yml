name: Validate repository publication
on:
  push:
  pull_request:
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check manifest and notebooks without training
        run: python scripts/validate_repo.py
      - name: Run repository structure tests
        run: python -m unittest discover -s tests -v
